<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PSDNS 2-column mockup</title>
<style>
:root {
  --bg: #1a1d23;
  --bg-panel: #20242d;
  --bg-terminal: #12141a;
  --border-color: #2a2e38;
  --text-primary: #e0e0e0;
  --text-muted: #7a8090;
  --accent-blue: #3b82f6;
  --accent-blue-hover: #2563eb;
  --accent-warn: #f59e0b;
  --accent-green: #4ade80;
  --on-accent: #ffffff;
  --radius-standard: 8px;
  --radius-compact: 5px;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px;
  --fs-xs: 11px; --fs-sm: 12px; --fs-md: 14px;
  --transition-med: 0.2s ease;
  --font-mono: 'Consolas', 'Courier New', monospace;
  --font-sans: -apple-system, 'Segoe UI', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text-primary); font-family: var(--font-sans); padding: 40px; }
h2 { font-size: var(--fs-md); margin-bottom: var(--s2); color: var(--text-muted); }

/* toggle row */
.toggle-row { display: flex; align-items: center; gap: var(--s2); margin-bottom: var(--s2); font-size: var(--fs-sm); color: var(--text-muted); }
.toggle-row input { cursor: pointer; }

/* ===== PSDNS 2-column list ===== */
.pkg-list {
  position: relative;
  background: var(--bg-terminal);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-compact);
  min-height: 120px;
  max-height: 320px;
  overflow-y: auto;
  font-family: var(--font-mono);
  font-size: var(--fs-sm);
  line-height: 1.6;
  padding: var(--s2) 0;
}
.pkg-row {
  display: flex;
  align-items: center;
  min-height: 28px;
  padding: 0 var(--s2);
}
.pkg-row:hover { background: rgba(255,255,255,0.03); }
.pkg-row.editing { background: rgba(59,130,246,0.14); }

.pkg-name {
  flex: 0 0 40%;
  padding: 2px var(--s2) 2px 0;
  color: var(--text-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  user-select: none;
}
.pkg-input {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  color: var(--text-primary);
  font-family: var(--font-mono);
  font-size: var(--fs-sm);
  padding: 2px 0;
  width: 100%;
}
.pkg-input::placeholder { color: var(--text-muted); opacity: 0.5; }
.pkg-input:disabled { color: var(--text-primary); cursor: default; pointer-events: none; }
.pkg-row.editing .pkg-input { color: var(--text-primary); }

.pkg-warn { color: var(--accent-warn); font-size: 10px; margin-left: 6px; white-space: nowrap; }
.pkg-warn-inline { color: var(--accent-warn); font-size: 10px; }
.pkg-list.no-name .pkg-name { display: none; }

.pkg-trash {
  display: none;
  flex: 0 0 auto;
  width: 22px; height: 22px;
  margin-left: 6px;
  border: none; background: transparent;
  color: var(--text-muted);
  cursor: pointer; border-radius: 3px;
  align-items: center; justify-content: center;
}
.pkg-row:hover .pkg-trash { display: flex; }
.pkg-trash:hover { background: rgba(245,158,11,0.18); color: var(--accent-warn); }
.pkg-trash svg { width: 14px; height: 14px; }

.hint { color: var(--text-muted); font-size: var(--fs-xs); margin-top: 6px; }

/* ===== plain textarea (PSDNS off) ===== */
.plain-ta {
  background: var(--bg-terminal);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-compact);
  color: var(--text-primary);
  font-family: var(--font-mono);
  font-size: var(--fs-sm);
  line-height: 1.6;
  padding: var(--s2);
  width: 100%;
  min-height: 120px;
  resize: vertical;
  outline: none;
}
.plain-ta:focus { border-color: var(--accent-blue); }

/* ===== popup (copiado de style.css) ===== */
.popup-backdrop {
  position: fixed; inset: 0; z-index: 2000;
  display: flex; align-items: center; justify-content: center;
  padding: 24px; background: rgba(0,0,0,0.58);
  opacity: 0; transition: opacity var(--transition-med);
}
.popup-backdrop[hidden] { display: none !important; }
.popup-backdrop.ax-in { opacity: 1; }
.popup-card {
  width: min(100%, 460px);
  max-height: min(100%, 560px);
  background: var(--bg-panel);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-standard);
  box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  display: flex; flex-direction: column;
  gap: var(--s3); padding: var(--s4); overflow: hidden;
}
.popup-title { font-size: var(--fs-md); font-weight: 600; color: var(--text-primary); }
.popup-body { font-size: var(--fs-xs); color: var(--text-muted); line-height: 1.5; overflow: auto; }
.popup-foot { display: flex; align-items: center; justify-content: flex-end; gap: var(--s2); margin-top: var(--s1); }
.popup-btn {
  border: none; border-radius: var(--radius-compact);
  padding: var(--s1) var(--s3); font-size: var(--fs-xs); font-weight: 600; cursor: pointer;
}
.popup-btn-primary { background-color: var(--accent-blue); color: var(--on-accent); }
.popup-btn-primary:hover { background-color: var(--accent-blue-hover); }
.popup-btn-danger { background-color: var(--accent-warn); color: var(--on-accent); }
.popup-btn-ghost { background: transparent; color: var(--text-muted); border: 1px solid var(--border-color); }
.popup-btn-ghost:hover { color: var(--text-primary); border-color: var(--text-muted); }
</style>
</head>
<body>

<label class="toggle-row"><input type="checkbox" id="psdnsToggle" checked> Psdns</label>
<h2>Target (filter_t, one per line)</h2>
<div class="pkg-list" id="pkgList"></div>
<textarea class="plain-ta" id="plainTa" spellcheck="false" hidden></textarea>
<small class="hint" id="hint" data-i18n="psdns.doubleTap">Double-tap to tweak</small>

<script>
// ===== Popup (copiado de UI/popup.js) =====
window.Popup = (function () {
  let active = null;
  function makeBackdrop() {
    const bd = document.createElement('div');
    bd.className = 'popup-backdrop'; bd.hidden = true;
    document.body.appendChild(bd); return bd;
  }
  function animateIn(bd) { bd.hidden = false; requestAnimationFrame(() => bd.classList.add('ax-in')); }
  function animateOut(bd, done) {
    bd.classList.remove('ax-in');
    setTimeout(() => { bd.hidden = true; if (typeof done === 'function') done(); }, 200);
  }
  function onKey(e) { if (e.key === 'Escape' && active && active.dismissable) { e.preventDefault(); finish('dismiss'); } }
  function finish(result) {
    if (!active) return;
    const a = active; active = null;
    document.removeEventListener('keydown', onKey, true);
    animateOut(a.backdrop, () => { a.backdrop.remove(); if (typeof a.onClose === 'function') a.onClose(result); });
    a.resolve(result);
  }
  function open(cardEl, opts) {
    opts = opts || {};
    if (active) finish('dismiss');
    const bd = makeBackdrop(); bd.appendChild(cardEl);
    const dismissable = opts.dismissable !== false;
    active = { backdrop: bd, card: cardEl, dismissable, onClose: opts.onClose || null, resolve: null };
    const p = new Promise(res => { active.resolve = res; });
    if (dismissable) {
      bd.addEventListener('mousedown', function (e) { if (e.target === bd) finish('dismiss'); });
      document.addEventListener('keydown', onKey, true);
    }
    animateIn(bd); return p;
  }
  function confirm(opts) {
    opts = opts || {};
    const card = document.createElement('div');
    card.className = 'popup-card'; card.setAttribute('role','dialog'); card.setAttribute('aria-modal','true');
    if (opts.title) { const t = document.createElement('div'); t.className='popup-title'; t.textContent=opts.title; card.appendChild(t); }
    if (opts.body) { const b = document.createElement('div'); b.className='popup-body'; if (typeof opts.body==='string') b.innerHTML=opts.body; else b.appendChild(opts.body); card.appendChild(b); }
    const foot = document.createElement('div'); foot.className='popup-foot';
    if (opts.cancelLabel) { const c=document.createElement('button'); c.type='button'; c.className='popup-btn popup-btn-ghost'; c.textContent=opts.cancelLabel; c.addEventListener('click',()=>finish('cancel')); foot.appendChild(c); }
    const ok=document.createElement('button'); ok.type='button'; ok.className='popup-btn popup-btn-primary'+(opts.danger?' popup-btn-danger':''); ok.textContent=opts.okLabel||'OK'; ok.addEventListener('click',()=>finish('ok')); foot.appendChild(ok);
    card.appendChild(foot);
    return open(card, { dismissable: opts.dismissable, onClose: opts.onClose });
  }
  function close() { if (active) finish('dismiss'); }
  return { open, confirm, close };
})();

// ===== data =====
const catalog = {
  'com.vivo.tips': 'Tips',
  'com.vivo.notes': 'Notes',
  'com.vivo.website.gdpr': 'vivo.com',
  'com.android.deskclock': 'Clock',
  'com.vivo.calculator': 'Calculator',
  'com.vivo.feedback': 'Feedback',
  'com.vivo.imanager': 'i Manager',
  'com.vivo.camera': 'Camera',
  'com.vivo.gallery': 'Gallery'
};
const TRASH_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>';

let lines = ['com.vivo.tips', 'com.vivo.notes', 'com.vivo.website.gdpr', ''];
let editLine = null;
let editOriginal = '';

const list = document.getElementById('pkgList');
const plainTa = document.getElementById('plainTa');
const hint = document.getElementById('hint');
const toggle = document.getElementById('psdnsToggle');

function psdnsOn() { return toggle.checked; }

function syncPlain() {
  plainTa.value = lines.filter(l => l.trim()).join('\n');
}

function render() {
  list.hidden = false; hint.hidden = !psdnsOn(); plainTa.hidden = true;
  list.classList.toggle('no-name', !psdnsOn());
  list.innerHTML = '';
  const lastIdx = lines.length - 1;

  lines.forEach((pkg, i) => {
    const row = document.createElement('div');
    row.className = 'pkg-row' + (i === editLine ? ' editing' : '');
    row.dataset.idx = i;

    const hasName = !!catalog[pkg];
    const isWarn = !!pkg && !hasName;

    const name = document.createElement('span');
    name.className = 'pkg-name';
    if (psdnsOn()) {
      if (hasName) {
        name.textContent = catalog[pkg];
      } else if (isWarn) {
        name.innerHTML = '<span class="pkg-warn-inline">\u26A0 not indexed</span>';
      }
    }
    row.appendChild(name);

    const input = document.createElement('input');
    input.className = 'pkg-input';
    input.type = 'text'; input.spellcheck = false; input.value = pkg;

    const isActive = (i === lastIdx && editLine === null) || i === editLine;

    if (isActive) {
      input.disabled = false;
      input.placeholder = (i === lastIdx && !pkg) ? 'Type package or app name…' : '';
      input.addEventListener('keydown', e => {
        if (e.key === 'Enter') {
          e.preventDefault();
          const val = input.value.trim();
          if (i === lastIdx) {
            if (val) { lines[i] = val; lines.push(''); }
            render(); focusActive();
          } else {
            if (val) {
              lines[i] = val;
            } else {
              lines.splice(i, 1);
            }
            editLine = null;
            render(); focusActive();
          }
        } else if (e.key === 'Escape' && i !== lastIdx) {
          e.preventDefault();
          lines[i] = editOriginal;
          editLine = null;
          render(); focusActive();
        }
      });
    } else {
      input.disabled = true;
    }
    row.appendChild(input);

    if (!psdnsOn() && isWarn) {
      const warn = document.createElement('span');
      warn.className = 'pkg-warn'; warn.textContent = '\u26A0 not indexed';
      row.appendChild(warn);
    }

    if (i !== lastIdx) {
      const del = document.createElement('button');
      del.className = 'pkg-trash'; del.type = 'button'; del.title = 'Remove';
      del.innerHTML = TRASH_SVG;
      del.addEventListener('click', ev => {
        ev.stopPropagation();
        const idx = i;
        Popup.confirm({
          title: 'Delete package',
          body: 'Remove <b>' + (catalog[lines[idx]] || lines[idx]) + '</b> from the list?',
          okLabel: 'Delete', cancelLabel: 'Cancel', danger: true
        }).then(r => {
          if (r === 'ok') {
            lines.splice(idx, 1);
            if (editLine !== null && editLine >= idx) editLine = null;
            render(); focusActive();
          }
        });
      });
      row.appendChild(del);
    }

    row.addEventListener('dblclick', () => {
      if (i === lastIdx || editLine !== null) return;
      editOriginal = lines[i];
      editLine = i;
      render();
      const inp = list.querySelector('.pkg-row[data-idx="' + i + '"] .pkg-input');
      if (inp) { inp.focus(); inp.select(); }
    });

    list.appendChild(row);
  });
}

function focusActive() {
  if (!psdnsOn()) return;
  const lastIdx = lines.length - 1;
  const inp = list.querySelector('.pkg-row[data-idx="' + lastIdx + '"] .pkg-input');
  if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
}

toggle.addEventListener('change', () => { render(); if (psdnsOn()) focusActive(); });
plainTa.addEventListener('input', () => {
  lines = plainTa.value.split('\n');
  if (lines[lines.length-1] !== '') lines.push('');
});

render();
focusActive();
</script>

</body>
</html>
